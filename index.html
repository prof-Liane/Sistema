
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>
    
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

    <style>
        .tema-escuro {
            background-color: #222;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">

        <nav class="navbar sm:navbar-expand bg-1 fg-2">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Pricing</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                    </li>
                    </ul>
                </div>
                </dialog>
            </div>
            </nav>

    <h1>Cadastro de Usuários</h1>

    <hr>

    <h2>Alterar tema</h2>

    <button id="btnTema" class="btn btn-solid btn-styled theme-inverse">Alterar para tema escuro</button>

    <hr>

    <h2>Novo cadastro</h2>

    <form id="formCadastro">

        <label for="nome" class="form-label">Nome:</label>
        <input type="text" id="nome" class="form-control  mb-5" placeholder="Digite seu nome">

        <label for="email" class="form-label">E-mail:</label>
        <input type="email" id="email" class="form-control  mb-5" placeholder="Digite seu e-mail">

        <label for="idade" class="form-label">Idade:</label>
        <input type="number" id="idade" class="form-control mb-5" placeholder="Digite sua idade">

        <button type="submit" class="btn-solid theme-primary">Cadastrar</button>

    </form>

    <p id="mensagem"></p>

    <hr>

    <h2>Usuários cadastrados</h2>

    <button id="btnListar">Listar usuários</button>

    <div id="lista"></div>
    
    </div>
        
    <script src="script.js"></script>

    <!-- bootstrap -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    
    
</body>
</html>
